name: Add a game

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'Roblox game link'
        required: true

permissions:
  contents: write

concurrency:
  group: earlyspawn-data
  cancel-in-progress: false

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Add the game
        run: node scripts/add-game.mjs
        env:
          GAME_URL: ${{ inputs.url }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: Save changes
        run: |
          git config user.name "earlyspawn-bot"
          git config user.email "bot@earlyspawn.com"
          git add src/data data public/images
          git diff --cached --quiet || (git commit -m "Add game" && git push)
